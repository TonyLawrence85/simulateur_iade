AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'
    - 'vendor/**/*'

# Legacy business services intentionally favor explicit domain calculations.
# Keep RuboCop focused on correctness and maintainable style without forcing
# risky refactors solely to satisfy generic complexity thresholds.
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/BlockLength:
  Enabled: false

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/EmptyMethod:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

# Existing domain vocabulary includes short, meaningful names such as `nb`.
Naming/MethodParameterName:
  Enabled: false

Layout/LineLength:
  Max: 140
Layout/HashAlignment:
  Enabled: false

# Long guard clauses are common in validation-heavy calculators and remain
# readable without converting them into multi-line conditionals.
Style/IfUnlessModifier:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false
