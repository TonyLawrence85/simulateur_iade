AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'
    - 'vendor/**/*'

# Legacy business services intentionally favor explicit domain calculations.
# Keep RuboCop focused on correctness without forcing risky refactors or
# broad formatting churn solely to satisfy generic style preferences.
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/BlockLength:
  Enabled: false

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/EmptyMethod:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
Style/GuardClause:
  Enabled: false
Style/IdenticalConditionalBranches:
  Enabled: false
Style/Semicolon:
  Enabled: false
Style/StringConcatenation:
  Enabled: false

Lint/MissingSuper:
  Enabled: false
# Some legacy files contain local disables for metrics now disabled globally.
# Removing them is cosmetic and would create a large unrelated diff.
Lint/RedundantCopDisableDirective:
  Enabled: false
Lint/AmbiguousOperatorPrecedence:
  Enabled: false
Lint/RedundantSafeNavigation:
  Enabled: false

# Existing domain vocabulary mirrors French payroll/legal identifiers and
# deliberately includes names with numeric suffixes (grade2, tranche1, etc.).
Naming/MethodParameterName:
  Enabled: false
Naming/VariableNumber:
  Enabled: false

# Preserve the established formatting of legacy calculators. New code remains
# subject to the rest of the RuboCop rule set and CI still runs on every push.
Layout/LineLength:
  Max: 150
Layout/HashAlignment:
  Enabled: false
Layout/ArgumentAlignment:
  Enabled: false
Layout/ArrayAlignment:
  Enabled: false
Layout/ExtraSpacing:
  Enabled: false
Layout/SpaceAroundOperators:
  Enabled: false
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false
Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false
